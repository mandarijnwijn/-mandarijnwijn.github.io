<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Routekaart Nederland</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><style>html,body{height:100%;margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#111827}.app{display:grid;grid-template-columns:350px 1fr;height:100%}aside{overflow:auto;border-right:1px solid #e5e7eb;background:#fff;z-index:2}header{padding:16px;border-bottom:1px solid #e5e7eb;position:sticky;top:0;background:#fff;z-index:3}h1{font-size:22px;margin:0 0 4px}p{margin:0;color:#64748b;line-height:1.35}#map{height:100%;width:100%}.item{display:grid;grid-template-columns:34px 1fr;gap:9px;padding:10px 12px;border-bottom:1px solid #f1f5f9;cursor:pointer}.item:hover,.item.active{background:#fff7ed}.num{width:28px;height:28px;border-radius:50%;background:#d34a2c;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:13px}.title{font-weight:800;font-size:14px}.note{font-size:12.5px;color:#64748b;line-height:1.25;margin-top:2px}button{border:1px solid #e5e7eb;background:#fff;border-radius:999px;padding:8px 10px;font-weight:800;margin:10px 4px 0 0}.m{width:32px;height:32px;border-radius:50%;background:#d34a2c;color:white;border:3px solid white;display:flex;align-items:center;justify-content:center;font-weight:900;box-shadow:0 2px 10px #0005}.island{background:#1776b6}.stay{background:#2e7d32}.museum{background:#7b3f98}.attr{background:#b85c00}.port{background:white;border:2px solid #1776b6;color:#1776b6;border-radius:999px;padding:3px 8px;font-weight:900;font-size:12px;box-shadow:0 2px 9px #0003;white-space:nowrap}.pop h2{font-size:17px;margin:0 0 5px}.pop p{margin:0 0 10px}.pop a{display:inline-block;background:#d34a2c;color:#fff;text-decoration:none;border-radius:999px;padding:8px 10px;font-weight:800}@media(max-width:760px){.app{display:block}aside{height:38%;border-right:0;border-bottom:1px solid #e5e7eb}#map{height:62%}h1{font-size:19px}}</style></head><body><div class="app"><aside><header><h1>Route door Nederland</h1><p>Noord naar Zuid. Klik op een locatie of marker.</p><button onclick="fitAll()">Toon hele route</button><button onclick="go(0)">Start</button><button onclick="go(stops.length-1)">Eindpunt</button></header><div id="list"></div></aside><main id="map"></main></div><script>const stops=[[1,"Groningen",53.2194,6.5665,"Startpunt in het noorden."],[2,"Schiermonnikoog",53.4866,6.2072,"Waddeneiland. Veerboot via Lauwersoog."],[3,"Assen",52.9928,6.5642,"Hoofdstad van Drenthe."],[4,"Borger (Hunebedden)",52.9232,6.7934,"Hunebedcentrum en grootste hunebed van Nederland."],[5,"Giethoorn",52.74,6.0794,"Varen door het waterdorp."],[6,"Zwolle",52.5168,6.083,"Hoofdstad van Overijssel."],[7,"Leeuwarden",53.2012,5.7999,"Hoofdstad van Friesland."],[8,"Terschelling",53.3599,5.2143,"Waddeneiland. Veerboot via Harlingen."],[9,"Vlieland",53.2967,5.0667,"Waddeneiland. Veerboot via Harlingen."],[10,"Texel",53.0542,4.7976,"Waddeneiland. Veerboot via Den Helder."],[11,"Haarlem",52.3874,4.6462,"Hoofdstad van Noord-Holland."],[12,"Leiden",52.1601,4.497,"Extra stad op jullie route."],[13,"Den Haag",52.0705,4.3007,"Hoofdstad van Zuid-Holland."],[14,"Lelystad",52.5185,5.4714,"Hoofdstad van Flevoland."],[15,"Utrecht",52.0907,5.1214,"Hoofdstad van Utrecht."],[16,"Hoenderloo (3 dagen)",52.1176,5.8793,"Huisje op de Veluwe. Rustblok van 3 dagen."],[17,"Kröller-Müller Museum",52.0956,5.8169,"Museum in Nationaal Park De Hoge Veluwe."],[18,"Arnhem",51.9851,5.8987,"Hoofdstad van Gelderland."],[19,"Nijmegen",51.8126,5.8372,"Extra stad op jullie route."],[20,"Den Bosch",51.6978,5.3037,"Hoofdstad van Noord-Brabant."],[21,"Middelburg",51.4988,3.6109,"Hoofdstad van Zeeland."],[22,"Maastricht",50.8514,5.691,"Hoofdstad van Limburg."],[23,"Valkenburg (grotten)",50.8652,5.832,"Grotten en mergellandschap."],[24,"Drielandenpunt Vaals",50.7545,6.0207,"Eindpunt: Nederland, België en Duitsland."]],ports=[["Lauwersoog",53.4046,6.2086,"Veerboot naar Schiermonnikoog."],["Harlingen",53.1746,5.4224,"Veerboot naar Terschelling en Vlieland."],["Den Helder",52.9599,4.7593,"Veerboot naar Texel."]],drive=[[53.2194,6.5665],[53.4046,6.2086],[52.9928,6.5642],[52.9232,6.7934],[52.74,6.0794],[52.5168,6.083],[53.2012,5.7999],[53.1746,5.4224],[52.9599,4.7593],[52.3874,4.6462],[52.1601,4.497],[52.0705,4.3007],[52.5185,5.4714],[52.0907,5.1214],[52.1176,5.8793],[52.0956,5.8169],[51.9851,5.8987],[51.8126,5.8372],[51.6978,5.3037],[51.4988,3.6109],[50.8514,5.691],[50.8652,5.832],[50.7545,6.0207]],ferries=[["Lauwersoog → Schiermonnikoog",[[53.4046,6.2086],[53.4866,6.2072]]],["Harlingen → Terschelling",[[53.1746,5.4224],[53.3599,5.2143]]],["Harlingen → Vlieland",[[53.1746,5.4224],[53.2967,5.0667]]],["Den Helder → Texel",[[52.9599,4.7593],[53.0542,4.7976]]]];const map=L.map('map').setView([52.35,5.35],7);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap'}).addTo(map);const bounds=[];function cls(s){let n=s[0];if([2,8,9,10].includes(n))return'island';if(n==16)return'stay';if(n==17)return'museum';if([4,5,23,24].includes(n))return'attr';return''}function icon(s){return L.divIcon({className:'',html:`<div class="m ${cls(s)}">${s[0]}</div>`,iconSize:[36,36],iconAnchor:[18,18],popupAnchor:[0,-18]})}function url(s){return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(s[1]+' Nederland')}const markers=stops.map((s,i)=>{let m=L.marker([s[2],s[3]],{icon:icon(s)}).addTo(map);m.bindPopup(`<div class="pop"><h2>${s[0]}. ${s[1]}</h2><p>${s[4]}</p><a target="_blank" href="${url(s)}">Open in Google Maps</a></div>`);bounds.push([s[2],s[3]]);return m});ports.forEach(p=>{let ic=L.divIcon({className:'',html:`<div class="port">⚓ ${p[0]}</div>`,iconAnchor:[20,13]});L.marker([p[1],p[2]],{icon:ic}).addTo(map).bindPopup(`<b>${p[0]}</b><br>${p[3]}`);bounds.push([p[1],p[2]])});L.polyline(drive,{color:'#d34a2c',weight:5,opacity:.9}).addTo(map);ferries.forEach(f=>L.polyline(f[1],{color:'#1776b6',weight:4,dashArray:'9 9'}).addTo(map).bindPopup('<b>Veerboot '+f[0]+'</b>'));const list=document.getElementById('list');stops.forEach((s,i)=>{let d=document.createElement('div');d.className='item';d.innerHTML=`<div class="num">${s[0]}</div><div><div class="title">${s[1]}</div><div class="note">${s[4]}</div></div>`;d.onclick=()=>go(i);list.appendChild(d)});function go(i){let s=stops[i];map.flyTo([s[2],s[3]],12);setTimeout(()=>markers[i].openPopup(),500);document.querySelectorAll('.item').forEach(e=>e.classList.remove('active'));document.querySelectorAll('.item')[i].classList.add('active')}function fitAll(){map.fitBounds(bounds,{padding:[35,35]})}fitAll();</script></body></html>
